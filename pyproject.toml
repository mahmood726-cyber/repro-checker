[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reprocheck"
version = "0.1.0"
description = "Meta-analysis reproducibility checker — re-derives a paper's pooled statistics from independently re-sourced primary trial data and reports what does not hold up."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mahmood Ahmad" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
reprocheck = "reprocheck.cli:main"

[tool.setuptools]
packages = ["reprocheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: tests that hit PubMed/CT.gov (deselect with -m 'not network')"]
